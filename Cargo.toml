[package]
name = "tray-goblin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
